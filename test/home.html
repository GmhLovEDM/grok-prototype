<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>首页 · 拾光</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    try {
      var raw = localStorage.getItem("shiguang.session");
      var session = raw ? JSON.parse(raw) : null;
      if (!session || typeof session.account !== "string" || !session.account) {
        location.replace("login.html");
      }
    } catch (e) {
      location.replace("login.html");
    }
  </script>
</head>
<body data-page="home">
  <div class="app">
    <main class="screen">
      <div class="screen-body">
        <div class="success-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16">
            <path d="M3.5 8.2 6.4 11l6.1-6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="eyebrow">登录成功</p>
        <h1>欢迎回来</h1>
        <div class="home-hero">
          <div class="avatar" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="6" fill="currentColor"/>
              <path d="M24 10v5M24 33v5M10 24h5M33 24h5M14.2 14.2l3.5 3.5M30.3 30.3l3.5 3.5M33.8 14.2l-3.5 3.5M17.7 30.3l-3.5 3.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="lead" id="welcome-line">正在读取账号…</p>
        </div>
        <article class="card">
          <p class="eyebrow">今天的拾光</p>
          <h2>窗边的下午</h2>
          <p>光从书架移到桌角。先把这句话记下，其余的可以等一会儿再写。</p>
          <ul class="stats">
            <li><strong>12</strong><span>已记录</span></li>
            <li><strong>3</strong><span>本周</span></li>
            <li><strong>1</strong><span>今日</span></li>
          </ul>
        </article>
        <p class="meta" id="login-time"></p>
        <div class="home-actions">
          <button class="btn btn-ghost btn-block" id="logout" type="button">退出登录</button>
          <p class="footnote">界面演示 · 数据仅保存在本机</p>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
