<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>拾光</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="welcome">
  <div class="app">
    <main class="screen screen-welcome">
      <div class="welcome-main">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="6" fill="currentColor"/>
              <path d="M24 8v6M24 34v6M8 24h6M34 24h6M12.8 12.8l4.2 4.2M31 31l4.2 4.2M35.2 12.8 31 17M17 31l-4.2 4.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <p class="eyebrow">日常手记</p>
            <h1>拾光</h1>
            <p class="lead">把一天里的小事，收成可以回看的光。</p>
          </div>
        </div>
        <ul class="points">
          <li>手机号或邮箱即可登录</li>
          <li>短信验证码完成注册</li>
          <li>忘记密码时可用验证码重置</li>
        </ul>
        <div class="actions">
          <p class="session-note" id="session-note" hidden></p>
          <a class="btn btn-primary btn-block" id="primary-action" href="login.html">登录</a>
          <a class="btn btn-ghost btn-block" href="register.html">注册账号</a>
          <p class="footnote">界面演示 · 数据仅保存在本机</p>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
