<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>登录 · 拾光</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <div class="app">
    <main class="screen">
      <header class="topbar">
        <a class="icon-btn" href="index.html" aria-label="返回上一页">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </header>
      <div class="screen-body">
        <h1>欢迎回来</h1>
        <p class="sub">使用手机号或邮箱登录拾光</p>
        <p class="banner" id="flash" role="status" hidden></p>
        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label for="account">手机号或邮箱</label>
            <input id="account" name="account" type="text" inputmode="email" autocomplete="username" placeholder="手机号或邮箱" aria-describedby="account-error" />
            <p class="error" id="account-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <div class="control">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="password-hint password-error" />
              <button type="button" class="ghost-inline" data-toggle-secret="password" aria-pressed="false" aria-label="显示密码">显示</button>
            </div>
            <p class="hint" id="password-hint">至少 8 位，需包含字母和数字</p>
            <p class="error" id="password-error" role="alert" hidden></p>
          </div>
          <div class="row-between">
            <label class="check">
              <input id="remember" name="remember" type="checkbox" />
              <span>记住我</span>
            </label>
            <a href="forgot.html">忘记密码？</a>
          </div>
          <button class="btn btn-primary btn-block" id="login-submit" type="submit">登录</button>
        </form>
        <p class="divider">其他方式</p>
        <div class="social">
          <button class="btn btn-social btn-block" type="button" data-visual-login="微信登录">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M9.5 4C5.4 4 2 6.9 2 10.4c0 2 1.1 3.8 2.9 5l-.7 2.6 2.8-1.5c.8.2 1.6.4 2.5.4.3 0 .6 0 .9-.1-.2-.6-.3-1.2-.3-1.8 0-3.3 3.1-6 6.9-6 .2 0 .5 0 .7.1C16.8 6.1 13.5 4 9.5 4zm-2.2 3.3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm4.6 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
              <path fill="currentColor" d="M22 14.2c0-2.7-2.7-4.9-6-4.9s-6 2.2-6 4.9 2.7 4.9 6 4.9c.6 0 1.2-.1 1.8-.2l2.2 1.2-.5-2c1.4-.9 2.5-2.3 2.5-3.9zm-7.8-.9a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zm3.6 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6z"/>
            </svg>
            微信登录
          </button>
          <button class="btn btn-social btn-block" type="button" data-visual-login="Apple 登录">
            <svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true">
              <path fill="currentColor" d="M13.1 9.5c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.7-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8s-1.8-.8-2.9-.8c-1.5 0-2.9.9-3.6 2.2-1.6 2.7-.4 6.7 1.1 8.9.7 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.8-.7s1.7.7 2.9.7 1.9-1.1 2.6-2.2c.8-1.2 1.1-2.3 1.2-2.4-.1 0-2.1-.8-2.1-3.6zM10.9 3.2c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 1.9-.5 2.5-1.2z"/>
            </svg>
            通过 Apple 登录
          </button>
        </div>
        <p class="switch">还没有账号？<a href="register.html">立即注册</a></p>
        <p class="footnote">界面演示 · 数据仅保存在本机</p>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
