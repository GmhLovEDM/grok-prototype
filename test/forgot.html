<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>重置密码 · 拾光</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="forgot">
  <div class="app">
    <main class="screen">
      <header class="topbar">
        <a class="icon-btn" href="login.html" aria-label="返回登录">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </header>
      <div class="screen-body">
        <h1>重置密码</h1>
        <p class="sub">向手机号或邮箱发送验证码，设置一个新密码</p>
        <form class="form" id="forgot-form" novalidate>
          <div class="field">
            <label for="account">手机号或邮箱</label>
            <input id="account" name="account" type="text" inputmode="email" autocomplete="username" placeholder="手机号或邮箱" aria-describedby="account-error" />
            <p class="error" id="account-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="code">验证码</label>
            <div class="code-row">
              <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位数字" aria-describedby="code-status code-error" />
              <button type="button" id="send-code" data-again="重新获取">获取验证码</button>
            </div>
            <p class="status" id="code-status" role="status"></p>
            <p class="error" id="code-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="password">新密码</label>
            <div class="control">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="请设置新密码" aria-describedby="password-hint password-error" />
              <button type="button" class="ghost-inline" data-toggle-secret="password" aria-pressed="false" aria-label="显示密码">显示</button>
            </div>
            <p class="hint" id="password-hint">至少 8 位，需包含字母和数字</p>
            <p class="error" id="password-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="confirm">确认新密码</label>
            <div class="control">
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="再次输入新密码" aria-describedby="confirm-error" />
              <button type="button" class="ghost-inline" data-toggle-secret="confirm" aria-pressed="false" aria-label="显示密码">显示</button>
            </div>
            <p class="error" id="confirm-error" role="alert" hidden></p>
          </div>
          <button class="btn btn-primary btn-block" id="forgot-submit" type="submit">确认重置</button>
        </form>
        <p class="switch"><a href="login.html">返回登录</a></p>
        <p class="footnote">界面演示 · 数据仅保存在本机</p>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
