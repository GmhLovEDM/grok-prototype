<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汐湾咖啡馆 · 选项</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="page-choices">
  <div class="stage">
    <div class="bg" aria-hidden="true"></div>
    <img class="portrait" alt="" src="../../assets/portraits/lu-yu/lu-yu_smile.png">
    <header class="hud">
      <div class="hud-inner">
        <p class="hud-day"><b>第 2 天</b><span class="hud-total">/ 60</span><span class="hud-chapter">第一章</span><span>潮汐</span></p>
        <nav class="hud-actions" aria-label="顶部菜单">
          <button class="hud-btn" type="button">自动</button>
          <button class="hud-btn" type="button">快进</button>
          <button class="hud-btn" type="button">日志</button>
          <button class="hud-btn" type="button">菜单</button>
        </nav>
      </div>
    </header>
    <div class="choice-list" aria-label="选项">
      <div class="choice-item">
        <span class="state-tag design-only" aria-hidden="true">默认</span>
        <button class="choice" type="button"><span>让他先看漏水</span></button>
      </div>
      <div class="choice-item">
        <span class="state-tag design-only" aria-hidden="true">悬停</span>
        <button class="choice is-hover" type="button"><span>把扳手递过去</span></button>
      </div>
      <div class="choice-item">
        <span class="state-tag design-only" aria-hidden="true">按下</span>
        <button class="choice is-pressed" type="button"><span>问他还记不记得</span></button>
      </div>
      <div class="choice-item">
        <span class="state-tag design-only" aria-hidden="true">禁用</span>
        <button class="choice is-disabled" type="button" disabled><span>这句先别问出口</span></button>
      </div>
      <div class="choice-item">
        <span class="state-tag design-only" aria-hidden="true">已选过</span>
        <button class="choice is-chosen" type="button"><span>端一杯水给他</span><em>已选过</em></button>
      </div>
    </div>
  </div>
</body>
</html>
