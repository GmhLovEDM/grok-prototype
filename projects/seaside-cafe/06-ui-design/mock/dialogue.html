<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>汐湾咖啡馆 · 对白</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">

<body class="page-dialogue">
  <div class="stage">
    <div class="bg" aria-hidden="true"></div>
    <img class="portrait" alt="" src="../../assets/portraits/lu-yu/lu-yu_normal.png">
    <header class="hud">
      <div class="hud-inner">
        <p class="hud-day"><b>第 2 天</b><span class="hud-total">/ 60</span><span class="hud-chapter">第一章</span><span>潮汐</span></p>
        <nav class="hud-actions" aria-label="顶部菜单">
          <button class="hud-btn" type="button">自动</button>

          <button class="hud-btn" type="button">日志</button>
          <button class="hud-btn" type="button">菜单</button>
        </nav>
      </div>
    </header>
    <section class="dialogue" aria-label="对白">
      <h2 class="nameplate">陆屿</h2>
      <p class="line is-typed">啧，你别动，我来。</p>
      <p class="continue"><span>点击继续</span><i aria-hidden="true"></i></p>
    </section>
  </div>

</html>
